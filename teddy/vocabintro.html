<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teddy</title>
  <style>
    :root{
      --bg1:#fff7ed;
      --bg2:#eef2ff;
      --card:#ffffff;
      --ink:#1f2937;
      --muted:#6b7280;
      --primary:#6d5dfc;
      --primary-dark:#4f46e5;
      --accent:#ffb703;
      --green:#16a34a;
      --green-bg:#dcfce7;
      --red:#dc2626;
      --red-bg:#fee2e2;
      --blue-bg:#eff6ff;
      --line:#e5e7eb;
      --shadow:0 18px 45px rgba(31,41,55,.14);
      --radius:26px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      min-height:100vh;
      background:
        radial-gradient(circle at top left,rgba(255,183,3,.28),transparent 30rem),
        radial-gradient(circle at bottom right,rgba(109,93,252,.24),transparent 34rem),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      padding:24px;
    }

    .app{width:min(1080px,100%);margin:0 auto}

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      margin-bottom:22px;
    }

    .brand{display:flex;align-items:center;gap:14px}

    .logo{
      width:58px;height:58px;border-radius:19px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--primary),#22c55e);
      color:white;font-size:1.9rem;box-shadow:0 12px 25px rgba(79,70,229,.25)
    }

    h1,h2,h3{margin:0;line-height:1.1}
    h1{font-size:clamp(2rem,4vw,3.3rem);letter-spacing:-.045em}
    h2{font-size:clamp(1.45rem,2.5vw,2.25rem);letter-spacing:-.035em}
    h3{font-size:1.05rem}
    p{line-height:1.55}

    .subtitle{color:var(--muted);font-weight:650;margin:.3rem 0 0}

    .btn{
      border:0;cursor:pointer;font:inherit;font-weight:900;
      background:var(--primary);color:white;
      padding:13px 18px;border-radius:16px;
      box-shadow:0 10px 22px rgba(79,70,229,.25);
      transition:.18s ease;
    }
    .btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .btn.secondary,.btn.ghost{background:white;color:var(--primary-dark);border:1px solid #c7d2fe;box-shadow:none}
    .btn.ghost{background:rgba(255,255,255,.76)}
    .btn.small{padding:10px 13px;border-radius:13px;font-size:.92rem}

    .hero,.game-card,.result-card{
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.8);
      box-shadow:var(--shadow);
      border-radius:var(--radius);
    }

    .hero{padding:42px;position:relative;overflow:hidden}
    .hero::after{
      content:"Teddy";
      position:absolute;right:-18px;top:14px;
      font-size:clamp(60px,13vw,145px);font-weight:1000;
      color:rgba(109,93,252,.08);transform:rotate(-7deg);pointer-events:none;
    }

    .mission-grid{
      margin-top:26px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(235px,1fr));
      gap:14px;
    }

    .mission-card{
      text-align:left;background:white;color:var(--ink);
      border:2px solid var(--line);border-radius:22px;
      padding:18px;display:flex;gap:14px;align-items:flex-start;
      box-shadow:0 8px 18px rgba(31,41,55,.06);
      cursor:pointer;transition:.18s ease;
    }
    .mission-card:hover{border-color:var(--primary);background:#f5f3ff;transform:translateY(-1px)}
    .mission-number{
      width:42px;height:42px;border-radius:15px;
      display:grid;place-items:center;background:#eef2ff;color:var(--primary-dark);
      font-size:1.25rem;font-weight:950;flex:0 0 auto;
    }
    .mission-card h3{margin-bottom:6px}
    .mission-card p{margin:0;color:var(--muted);font-weight:650;font-size:.94rem}

    .game-card{padding:clamp(22px,4vw,40px)}
    .game-header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}
    .activity-label{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;background:#fff7ed;color:#c2410c;
      border:1px solid #fed7aa;border-radius:999px;
      font-weight:950;font-size:.85rem;margin-bottom:12px;
    }
    .mission-title{color:var(--primary-dark)}

    .progress-wrap{margin:18px 0 24px}
    .progress-row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-weight:850;font-size:.92rem;margin-bottom:8px}
    .progress-track{height:14px;background:#f8fafc;border:1px solid rgba(109,93,252,.18);border-radius:999px;overflow:hidden}
    .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),#22c55e);border-radius:999px;transition:width .3s ease}

    .context-box,.prompt-box,.inventory-box,.target-box{
      background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:18px;margin:18px 0;
    }
    .context-box{background:#fffbeb;border-left:6px solid var(--accent);font-weight:800}
    .prompt-box .prompt{font-size:clamp(1.35rem,3vw,2.1rem);font-weight:1000;letter-spacing:-.02em}
    .mini-note{color:var(--muted);font-size:.93rem;font-weight:650;margin-top:8px}

    .options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}
    .option{
      text-align:left;background:white;color:var(--ink);border:2px solid var(--line);
      padding:16px;border-radius:18px;font-weight:900;min-height:64px;
      display:flex;gap:10px;align-items:center;cursor:pointer;transition:.18s ease;
    }
    .option:hover:not(:disabled){border-color:#c7d2fe;background:#f5f3ff;transform:translateY(-1px)}
    .option.selected{border-color:var(--primary);background:#eef2ff}
    .option.correct{border-color:var(--green);background:var(--green-bg)}
    .option.incorrect{border-color:var(--red);background:var(--red-bg)}
    .letter{
      width:30px;height:30px;border-radius:10px;display:inline-grid;place-items:center;
      background:#eef2ff;color:var(--primary-dark);font-weight:1000;flex:0 0 auto;
    }

    .dialogue-area{display:grid;gap:16px;margin-top:18px}
    .dialogue-line{
      display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;
      background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px;
    }
    .speaker{font-weight:1000;color:var(--primary-dark)}
    .slot{
      min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;
      background:white;border:2px dashed #cbd5e1;border-radius:16px;padding:12px 14px;font-weight:900;
    }
    .slot.filled{border-style:solid;border-color:#c7d2fe}
    .slot.correct-slot{border-color:var(--green);background:var(--green-bg)}
    .slot.incorrect-slot{border-color:var(--red);background:var(--red-bg)}
    .tile-bank{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}
    .tile{
      background:white;border:2px solid var(--line);border-radius:16px;padding:14px;font-weight:900;text-align:center;cursor:pointer;transition:.18s ease;
    }
    .tile:hover:not(:disabled){border-color:var(--primary);background:#f5f3ff;transform:translateY(-1px)}
    .tile.disabled{opacity:.35;cursor:default}

    .match-grid,.frame-grid,.sort-grid{display:grid;gap:12px;margin-top:18px}
    .match-grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
    .match-card,.frame-card,.sort-row{
      background:white;border:1px solid var(--line);border-radius:18px;padding:16px;
    }
    .match-left,.frame-label,.sort-text{font-weight:1000;font-size:1.14rem;margin-bottom:10px}
    select,.type-input{
      width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);
      background:white;font:inherit;font-weight:800;color:var(--ink);
    }
    select:focus,.type-input:focus{outline:none;border-color:var(--primary)}
    select.correct-select,.type-input.correct-input{border-color:var(--green);background:var(--green-bg)}
    select.incorrect-select,.type-input.incorrect-input{border-color:var(--red);background:var(--red-bg)}
    .frame-grid{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
    .frame-line{font-size:1.08rem;font-weight:800;line-height:1.55}
    .sort-row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(180px,.75fr);gap:12px;align-items:center}

    .inventory-box ul{margin:8px 0 0;padding-left:22px;font-weight:750}



    .flash-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(155px,1fr));
      gap:14px;
      margin-top:20px;
    }
    .flash-card{
      min-height:150px;
      border:0;
      background:transparent;
      perspective:900px;
      cursor:pointer;
      font:inherit;
      padding:0;
    }
    .flash-inner{
      display:block;
      position:relative;
      width:100%;
      min-height:150px;
      transition:transform .45s ease;
      transform-style:preserve-3d;
      -webkit-transform-style:preserve-3d;
    }
    .flash-card.flipped .flash-inner{transform:rotateY(180deg)}
    .flash-face{
      position:absolute;inset:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:10px;text-align:center;
      border:2px solid var(--line);border-radius:22px;
      background:white;box-shadow:0 8px 18px rgba(31,41,55,.06);
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      padding:16px;
    }
    .flash-front{background:#fff7ed;border-color:#fed7aa}
    .flash-back{background:#eef2ff;border-color:#c7d2fe;transform:rotateY(180deg)}
    .flash-emoji{font-size:2.2rem;line-height:1}
    .flash-word{font-size:1.2rem;font-weight:1000;color:var(--ink)}
    .flash-meaning{font-size:1.05rem;font-weight:900;color:var(--primary-dark)}
    .flash-hint{text-align:center;color:var(--muted);font-weight:750;margin-top:12px}

    .section-intro{
      background:linear-gradient(135deg,#fff7ed,#eef2ff);
      border:1px solid #e0e7ff;
      border-radius:24px;
      padding:22px;
      margin:18px 0;
    }
    .section-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:14px;
      margin-top:18px;
    }
    .section-card{
      text-align:left;
      background:white;
      color:var(--ink);
      border:2px solid var(--line);
      border-radius:20px;
      padding:17px;
      cursor:pointer;
      min-height:126px;
      display:flex;
      flex-direction:column;
      gap:9px;
      box-shadow:0 8px 18px rgba(31,41,55,.06);
      transition:.18s ease;
    }
    .section-card:hover{
      border-color:var(--primary);
      background:#f5f3ff;
      transform:translateY(-1px);
    }
    .section-card .section-icon{font-size:1.7rem;line-height:1}
    .section-card .section-title{font-weight:1000;font-size:1.05rem}
    .section-card .section-desc{color:var(--muted);font-weight:700;font-size:.92rem;line-height:1.4}

    .lesson-wrap{display:grid;gap:16px;margin-top:18px}
    .lesson-slide{
      background:white;
      border:1px solid var(--line);
      border-radius:24px;
      padding:22px;
      box-shadow:0 8px 18px rgba(31,41,55,.06);
    }
    .lesson-slide.hero-slide{
      background:linear-gradient(135deg,#eef2ff,#fff7ed);
      border-color:#c7d2fe;
    }
    .lesson-kicker{
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:#fff7ed;
      color:#c2410c;
      border:1px solid #fed7aa;
      border-radius:999px;
      padding:7px 11px;
      font-weight:1000;
      font-size:.78rem;
      margin-bottom:12px;
      text-transform:uppercase;
      letter-spacing:.04em;
    }
    .lesson-title{font-size:clamp(1.35rem,3vw,2.15rem);margin-bottom:10px;color:var(--primary-dark)}
    .lesson-subtitle{font-size:1.02rem;color:var(--muted);font-weight:750;margin:0 0 14px}
    .lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
    .rule-card{
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:18px;
      padding:15px;
    }
    .rule-card strong{display:block;font-size:1.12rem;margin-bottom:4px;color:var(--ink)}
    .rule-card span{display:block;color:var(--muted);font-weight:750;line-height:1.42}
    .mini-table{width:100%;border-collapse:separate;border-spacing:0 8px;margin-top:10px}
    .mini-table th{text-align:left;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;padding:0 10px}
    .mini-table td{background:#f8fafc;padding:12px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:850}
    .mini-table td:first-child{border-left:1px solid var(--line);border-radius:13px 0 0 13px;color:var(--primary-dark);font-weight:1000}
    .mini-table td:last-child{border-right:1px solid var(--line);border-radius:0 13px 13px 0;color:var(--muted)}
    .formula-box{
      background:#0f172a;
      color:white;
      border-radius:20px;
      padding:18px;
      font-size:clamp(1.15rem,2.5vw,1.65rem);
      font-weight:1000;
      line-height:1.45;
      margin-top:12px;
    }
    .formula-box .muted-formula{color:#cbd5e1;font-size:.9em}
    .lesson-note{
      background:#fffbeb;
      border-left:6px solid var(--accent);
      border-radius:16px;
      padding:14px 16px;
      margin-top:14px;
      font-weight:800;
      color:#713f12;
    }




    .section-intro{
      background:linear-gradient(135deg,#eef2ff,#fff7ed);
      border:1px solid #dbe4ff;
      border-radius:24px;
      padding:22px;
      margin:16px 0 20px;
    }
    .section-menu-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:14px;
      margin-top:18px;
    }
    .section-card{
      text-align:left;
      background:white;
      border:2px solid var(--line);
      border-radius:20px;
      padding:18px;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(31,41,55,.06);
      transition:.18s ease;
      min-height:128px;
    }
    .section-card:hover{border-color:var(--primary);background:#f5f3ff;transform:translateY(-1px)}
    .section-card .section-icon{font-size:1.8rem;margin-bottom:10px;display:block}
    .section-card h3{margin-bottom:7px;color:var(--primary-dark)}
    .section-card p{margin:0;color:var(--muted);font-weight:650;font-size:.94rem}

    .lesson-stack{display:grid;gap:18px;margin-top:18px}
    .lesson-page{
      background:white;
      border:1px solid var(--line);
      border-radius:24px;
      padding:22px;
      box-shadow:0 8px 18px rgba(31,41,55,.05);
    }
    .lesson-heading{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
    .lesson-icon{
      width:44px;height:44px;border-radius:16px;
      display:grid;place-items:center;flex:0 0 auto;
      background:#eef2ff;color:var(--primary-dark);font-size:1.5rem;
    }
    .lesson-page h3{font-size:1.35rem;color:var(--primary-dark);margin-bottom:5px}
    .lesson-lead{margin:0;color:var(--muted);font-weight:750}
    .rule-grid,.example-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:15px}
    .rule-card,.example-card,.quick-check{
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:18px;
      padding:15px;
    }
    .rule-label{font-weight:1000;color:var(--primary-dark);margin-bottom:6px}
    .rule-text{font-weight:760;color:var(--ink);line-height:1.45}
    .example-es{font-size:1.08rem;font-weight:1000;margin-bottom:5px}
    .example-en{color:var(--muted);font-weight:750}
    .example-note{font-size:.9rem;color:#92400e;background:#fffbeb;border-radius:12px;padding:8px;margin-top:8px;font-weight:750}
    .mini-table{width:100%;border-collapse:separate;border-spacing:0;margin-top:15px;overflow:hidden;border-radius:16px;border:1px solid var(--line)}
    .mini-table th,.mini-table td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-weight:760;vertical-align:top}
    .mini-table th{background:#eef2ff;color:var(--primary-dark);font-weight:1000}
    .mini-table tr:last-child td{border-bottom:0}
    .quick-check{margin-top:15px;background:#ecfdf5;border-color:#bbf7d0}
    .quick-check-title{font-weight:1000;color:#166534;margin-bottom:6px}
    .quick-check p{margin:.2rem 0;font-weight:760}
    .quick-check details{margin-top:10px}
    .quick-check summary{
      cursor:pointer;
      display:inline-block;
      padding:8px 12px;
      border-radius:12px;
      background:white;
      border:1px solid #86efac;
      color:#166534;
      font-weight:1000;
    }
    .quick-check details[open] summary{margin-bottom:8px}
    .quick-answer{
      background:white;
      border:1px solid #bbf7d0;
      border-radius:14px;
      padding:10px 12px;
      color:#166534;
      font-weight:800;
    }
    .formula-pill{
      display:inline-block;
      padding:7px 11px;
      margin:5px 5px 0 0;
      border-radius:999px;
      background:#fff7ed;
      border:1px solid #fed7aa;
      font-weight:950;color:#9a3412;
    }

    .feedback{display:none;margin-top:18px;padding:16px 18px;border-radius:18px;font-weight:800;border:1px solid var(--line)}
    .feedback.show{display:block}
    .feedback.ok{background:var(--green-bg);border-color:#86efac;color:#166534}
    .feedback.bad{background:var(--red-bg);border-color:#fecaca;color:#991b1b}
    .answer-line{margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.1)}

    .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:24px}
    .hidden{display:none!important}

    .result-card{text-align:center;padding:46px 28px}
    .score-num{font-size:clamp(2.6rem,8vw,5rem);font-weight:1000;color:var(--primary-dark);margin:20px 0 6px}

    @media(max-width:720px){
      body{padding:14px}
      .topbar,.game-header{flex-direction:column;align-items:flex-start}
      .hero,.game-card{padding:22px;border-radius:24px}
      .options,.sort-row{grid-template-columns:1fr}
      .dialogue-line{grid-template-columns:1fr}
      .controls .btn{flex:1 1 auto}
    }
  
    .teddy-review-box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:4px}
    .teddy-review-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px}
    .teddy-review-head h3{margin:0;color:var(--primary-dark);font-size:1.05rem}
    .teddy-review-count{display:inline-flex;align-items:center;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:999px;padding:6px 10px;font-weight:950;font-size:.82rem}
    .teddy-review-list{display:grid;gap:8px;max-height:330px;overflow:auto}
    .teddy-review-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:11px 12px}
    .teddy-review-term{font-weight:1000;color:var(--ink);line-height:1.3}
    .teddy-review-meaning{color:var(--muted);font-weight:800;font-size:.9rem;line-height:1.35;margin-top:3px}
    .teddy-review-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
    .teddy-flag-btn{margin-top:14px;border:2px solid #c7d2fe;background:white;color:var(--primary-dark);border-radius:14px;padding:10px 13px;font:inherit;font-weight:950;cursor:pointer}
    .teddy-flag-btn.marked{border-color:#f59e0b;background:#fffbeb;color:#92400e}
    .teddy-review-empty{color:var(--muted);font-weight:800;margin:0;line-height:1.45}
    .estar-contrast{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:14px}
    .estar-side{border:1px solid var(--line);border-radius:18px;padding:15px;background:#f8fafc}
    .estar-side h4{margin:0 0 9px;color:var(--primary-dark);font-size:1.05rem}
    .estar-side p{margin:5px 0;font-weight:800;line-height:1.4}
    @media(max-width:640px){.teddy-review-row{grid-template-columns:1fr}.teddy-review-row .btn{width:100%}}

  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">🎯</div>
        <div>
          <h1 id="pageTitle">Teddy</h1>
          <p class="subtitle" id="pageSubtitle">Spanish Vocabulary and Grammar Missions</p>
        </div>
      </div>
      <button class="btn ghost hidden" id="topMenuBtn">Main menu</button>
    </header>

    <main id="menuView">
      <section class="hero">
        <h2>Ready to practice?</h2>
        <p class="subtitle">Choose a mission, a vocabulary game, or full practice. You will see the correct answer only after you try.</p>
        <div class="controls" style="margin-top:24px;">
          <button class="btn" id="allPracticeBtn">Start full practice</button>
        </div>
        <div class="mission-grid" id="missionGrid"></div>

        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    function escapeHtml(str){
      return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function normalizeText(str){
      return String(str || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[¿?¡!.,]/g,"")
        .replace(/\s+/g," ");

      {
        id:"questionWords",
        title:"Question words",
        desc:"Practice information questions, answer types, and qué/cuál patterns.",

        items:() => [
          lesson("Presentation: WH questions one-page guide", "Read the one-page guide. Then choose a practice part or continue.", [
            {"hero": true, "kicker": "One-page guide", "title": "WH Questions / Information Questions", "subtitle": "Use the answer type and the question structure to choose the right question word.", "html": "\n<div class='lesson-stack'>\n  <div class='lesson-page'>\n    <div class='lesson-heading'><div class='lesson-icon'>1</div><div><h3>Two kinds of questions</h3><p class='lesson-lead'>Spanish questions can ask for yes/no or for specific information.</p></div></div>\n    <div class='rule-grid'>\n      <div class='rule-card'><div class='rule-label'>Yes / No question</div><div class='rule-text'><strong>\u00bfHablas franc\u00e9s?</strong><br>Do you speak French?<br><br><strong>S\u00ed, hablo franc\u00e9s.</strong><br>Yes, I speak French.<br><strong>No, no hablo franc\u00e9s.</strong><br>No, I do not speak French.</div></div>\n      <div class='rule-card'><div class='rule-label'>Information question</div><div class='rule-text'><strong>\u00bfD\u00f3nde trabajas?</strong><br>Where do you work?<br><br><strong>Trabajo en NAU.</strong><br>I work at NAU.<br><br>For this kind of question, you usually need a question word.</div></div>\n    </div>\n    <div class='formula-box'>Hablas franc\u00e9s. \u2192 \u00bfHablas franc\u00e9s?<br><span class='muted-formula'>You speak French. \u2192 Do you speak French?</span></div>\n  </div>\n\n  <div class='lesson-page'>\n    <div class='lesson-heading'><div class='lesson-icon'>2</div><div><h3>Strategy: look at the answer type first</h3><p class='lesson-lead'>Do not start by translating word by word. Start with: What kind of answer do I need?</p></div></div>\n    <table class='mini-table'>\n      <tr><th>Answer type</th><th>Use</th><th>Example question</th><th>Example answer</th></tr>\n      <tr><td>person</td><td><strong>qui\u00e9n</strong></td><td>\u00bfQui\u00e9n es el chico?</td><td>Es Miguel.</td></tr>\n      <tr><td>place</td><td><strong>d\u00f3nde</strong></td><td>\u00bfD\u00f3nde trabajas?</td><td>En NAU.</td></tr>\n      <tr><td>origin</td><td><strong>de d\u00f3nde</strong></td><td>\u00bfDe d\u00f3nde es Margarita?</td><td>Es de Ecuador.</td></tr>\n      <tr><td>time</td><td><strong>cu\u00e1ndo</strong></td><td>\u00bfCu\u00e1ndo viajas a Colombia?</td><td>En junio.</td></tr>\n      <tr><td>how / manner</td><td><strong>c\u00f3mo</strong></td><td>\u00bfC\u00f3mo cantan los chicos?</td><td>Muy bien.</td></tr>\n      <tr><td>number / quantity</td><td><strong>cu\u00e1ntos/as</strong></td><td>\u00bfCu\u00e1ntos estudiantes hay?</td><td>Hay 21.</td></tr>\n      <tr><td>price / amount</td><td><strong>cu\u00e1nto</strong></td><td>\u00bfCu\u00e1nto cuesta?</td><td>200 d\u00f3lares.</td></tr>\n    </table>\n    <div class='lesson-note'>The difference between <strong>qu\u00e9</strong> and <strong>cu\u00e1l</strong> depends on the structure of the question, so it is explained below in the contrast section.</div>\n  </div>\n\n  <div class='lesson-page'>\n    <div class='lesson-heading'><div class='lesson-icon'>3</div><div><h3>Build the question from the answer</h3><p class='lesson-lead'>The answer gives you the clue.</p></div></div>\n    <div class='example-grid'>\n      <div class='example-card'><div class='example-es'>Es Miguel.</div><div class='example-en'>This answer is a person.</div><div class='example-note'>Person \u2192 \u00bfQui\u00e9n? \u2192 \u00bfQui\u00e9n es el chico?</div></div>\n      <div class='example-card'><div class='example-es'>En NAU.</div><div class='example-en'>This answer is a place.</div><div class='example-note'>Place \u2192 \u00bfD\u00f3nde? \u2192 \u00bfD\u00f3nde trabajas?</div></div>\n      <div class='example-card'><div class='example-es'>Es de Ecuador.</div><div class='example-en'>This answer is origin.</div><div class='example-note'>Origin \u2192 \u00bfDe d\u00f3nde? \u2192 \u00bfDe d\u00f3nde es Margarita?</div></div>\n      <div class='example-card'><div class='example-es'>En junio.</div><div class='example-en'>This answer is time.</div><div class='example-note'>Time \u2192 \u00bfCu\u00e1ndo? \u2192 \u00bfCu\u00e1ndo viajas?</div></div>\n      <div class='example-card'><div class='example-es'>Hay 21.</div><div class='example-en'>This answer is a number.</div><div class='example-note'>Number \u2192 \u00bfCu\u00e1ntos/as? \u2192 \u00bfCu\u00e1ntos estudiantes hay?</div></div>\n    </div>\n  </div>\n\n  <div class='lesson-page'>\n    <div class='lesson-heading'><div class='lesson-icon'>4</div><div><h3>Important contrast: d\u00f3nde vs. de d\u00f3nde</h3><p class='lesson-lead'>Both use d\u00f3nde, but they ask for different information.</p></div></div>\n    <table class='mini-table'>\n      <tr><th>Question</th><th>Use</th><th>Example answer</th></tr>\n      <tr><td><strong>\u00bfD\u00f3nde trabajas?</strong></td><td>location</td><td>Trabajo en NAU.</td></tr>\n      <tr><td><strong>\u00bfDe d\u00f3nde eres?</strong></td><td>origin</td><td>Soy de Colombia.</td></tr>\n    </table>\n    <div class='lesson-note'><strong>d\u00f3nde</strong> = location. <strong>de d\u00f3nde</strong> = origin.</div>\n  </div>\n\n  <div class='lesson-page'>\n    <div class='lesson-heading'><div class='lesson-icon'>5</div><div><h3>Important contrasts: qu\u00e9 and cu\u00e1l</h3><p class='lesson-lead'>Choose the pattern by looking at whether the noun is included and whether the answer is open or specific.</p></div></div>\n    <div class='rule-grid'>\n      <div class='rule-card'><div class='rule-label'>Qu\u00e9 + noun</div><div class='rule-text'>Use this when the noun is included and you are asking what/which kind of thing.<br><br><strong>\u00bfQu\u00e9 autob\u00fas tomas?</strong><br>What / which bus do you take?<br><br><strong>\u00bfQu\u00e9 m\u00fasica escuchas?</strong><br>What music do you listen to?</div></div>\n      <div class='rule-card'><div class='rule-label'>Cu\u00e1l + noun</div><div class='rule-text'>Use this when the noun is included and you are thinking about a specific set of options.<br><br><strong>\u00bfCu\u00e1l autob\u00fas tomas?</strong><br>Which bus do you take?<br><br><strong>\u00bfCu\u00e1l mochila necesitas?</strong><br>Which backpack do you need?</div></div>\n      <div class='rule-card'><div class='rule-label'>Qu\u00e9 + verb</div><div class='rule-text'>Use this when the answer is open: many things, activities or ideas are possible.<br><br><strong>\u00bfQu\u00e9 escuchas?</strong><br>What do you listen to?<br><br><strong>\u00bfQu\u00e9 compras?</strong><br>What do you buy?</div></div>\n      <div class='rule-card'><div class='rule-label'>Cu\u00e1l + verb</div><div class='rule-text'>Use this when the options are known and the noun is understood.<br><br><strong>\u00bfCu\u00e1l compras?</strong><br>Which one do you buy?<br><br><strong>\u00bfCu\u00e1l prefieres?</strong><br>Which one do you prefer?</div></div>\n    </div>\n    <table class='mini-table'>\n      <tr><th>Pattern</th><th>Use it when...</th><th>Example</th><th>Meaning</th></tr>\n      <tr><td><strong>\u00bfQu\u00e9 + noun + verb?</strong></td><td>the noun is included; main beginner pattern</td><td>\u00bfQu\u00e9 autob\u00fas tomas?</td><td>What / which bus do you take?</td></tr>\n      <tr><td><strong>\u00bfCu\u00e1l + noun + verb?</strong></td><td>the noun is included and options feel specific</td><td>\u00bfCu\u00e1l autob\u00fas tomas?</td><td>Which bus do you take?</td></tr>\n      <tr><td><strong>\u00bfQu\u00e9 + verb?</strong></td><td>the answer is open</td><td>\u00bfQu\u00e9 compras?</td><td>What do you buy?</td></tr>\n      <tr><td><strong>\u00bfCu\u00e1l + verb?</strong></td><td>the noun is understood; options are known</td><td>\u00bfCu\u00e1l compras?</td><td>Which one do you buy?</td></tr>\n      <tr><td><strong>\u00bfCu\u00e1l es tu...?</strong></td><td>asking for specific personal information</td><td>\u00bfCu\u00e1l es tu n\u00famero?</td><td>What is your number?</td></tr>\n    </table>\n  </div>\n\n  <div class='lesson-page'>\n    <div class='lesson-heading'><div class='lesson-icon'>6</div><div><h3>Quick checks</h3><p class='lesson-lead'>Read the clue first. Then open the answer.</p></div></div>\n    <div class='quick-check'><div class='quick-check-title'>Check 1</div><p>Answer: <strong>En junio.</strong></p><p>What question word do you need?</p><p>A. <strong>¿Quién?</strong> &nbsp; B. <strong>¿Cuándo?</strong> &nbsp; C. <strong>¿Dónde?</strong></p><details><summary>Show answer</summary><div class='quick-answer'><strong>B. ¿Cuándo?</strong><br>Because <strong>en junio</strong> is a time answer.</div></details></div>\n    <div class='quick-check'><div class='quick-check-title'>Check 2</div><p>Answer: <strong>Hay 21.</strong></p><p>What question word do you need?</p><p>A. <strong>¿Cuántos?</strong> &nbsp; B. <strong>¿Cómo?</strong> &nbsp; C. <strong>¿De dónde?</strong></p><details><summary>Show answer</summary><div class='quick-answer'><strong>A. ¿Cuántos?</strong><br>Because the answer is a number.</div></details></div>\n    <div class='quick-check'><div class='quick-check-title'>Check 3</div><p>Question: <strong>¿Qué autobús tomas?</strong></p><p>Why do we use <strong>qué</strong>?</p><p>A. The answer is a person. &nbsp; B. The noun <strong>autobús</strong> is included. &nbsp; C. The answer is a place.</p><details><summary>Show answer</summary><div class='quick-answer'><strong>B.</strong> Because the noun <strong>autobús</strong> is included.</div></details></div>\n    <div class='quick-check'><div class='quick-check-title'>Check 4</div><p>Situation: There are three books on the table. Ask: <strong>Which one do you need?</strong></p><p>A. <strong>¿Qué necesitas?</strong> &nbsp; B. <strong>¿Cuál necesitas?</strong> &nbsp; C. <strong>¿Dónde necesitas?</strong></p><details><summary>Show answer</summary><div class='quick-answer'><strong>B. ¿Cuál necesitas?</strong><br>Because the options are already clear.</div></details></div>\n    <div class='quick-check'><div class='quick-check-title'>Check 5</div><p>Ask: <strong>What do you listen to?</strong></p><p>A. <strong>¿Qué escuchas?</strong> &nbsp; B. <strong>¿Cuál escuchas?</strong> &nbsp; C. <strong>¿Dónde escuchas?</strong></p><details><summary>Show answer</summary><div class='quick-answer'><strong>A. ¿Qué escuchas?</strong><br>Because the answer is open.</div></details></div>\n  </div>\n\n  <div class='lesson-page'>\n    <div class='lesson-heading'><div class='lesson-icon'>7</div><div><h3>Event questions</h3><p class='lesson-lead'>Use these short questions to collect the basic information for an event.</p></div></div>\n    <table class='mini-table'>\n      <tr><th>Question</th><th>Meaning</th><th>Example answer</th></tr>\n      <tr><td><strong>\u00bfQu\u00e9?</strong></td><td>What event?</td><td>El concierto de Bad Bunny.</td></tr>\n      <tr><td><strong>\u00bfCu\u00e1ndo?</strong></td><td>When?</td><td>El 28 de septiembre a las 7:00 p.m.</td></tr>\n      <tr><td><strong>\u00bfD\u00f3nde?</strong></td><td>Where?</td><td>En Chase Field, en Phoenix.</td></tr>\n      <tr><td><strong>\u00bfCu\u00e1nto?</strong></td><td>How much?</td><td>200 d\u00f3lares.</td></tr>\n    </table>\n  </div>\n\n  <div class='lesson-page'>\n    <div class='lesson-heading'><div class='lesson-icon'>8</div><div><h3>Final strategy</h3><p class='lesson-lead'>When you make a question, start with the answer type and the pattern.</p></div></div>\n    <div class='rule-grid'>\n      <div class='rule-card'><div class='rule-label'>Answer type</div><div class='rule-text'>person \u2192 qui\u00e9n<br>place \u2192 d\u00f3nde<br>origin \u2192 de d\u00f3nde<br>time \u2192 cu\u00e1ndo<br>how \u2192 c\u00f3mo<br>number \u2192 cu\u00e1ntos/as<br>price \u2192 cu\u00e1nto</div></div>\n      <div class='rule-card'><div class='rule-label'>Qu\u00e9 / cu\u00e1l patterns</div><div class='rule-text'>noun included, general \u2192 qu\u00e9 + noun<br>noun included, specific options \u2192 cu\u00e1l + noun<br>open answer \u2192 qu\u00e9 + verb<br>known options \u2192 cu\u00e1l + verb</div></div>\n    </div>\n    <div class='formula-box'>\u00bfQu\u00e9     function itemMatchesSection(item, section){
      if(!section || section.key === "__all") return true;
      if(section.activities && section.activities.includes(item.activity)) return true;
      if(section.activityPrefixes && section.activityPrefixes.some(prefix => String(item.activity || "").startsWith(prefix))) return true;
      if(section.noScore === true && item.noScore) return true;
      return false;
    }

    function startMission(id, sectionKey="__all"){
      window.scrollTo(0,0);
      const mission = missions.find(m => m.id === id);
      currentMission = mission;
      lastMissionId = id;
      lastSectionKey = sectionKey;
      const section = mission.sections ? mission.sections.find(sec => sec.key === sectionKey) : null;
      let items = mission.items().map(item => ({...item, missionTitle:mission.title, missionDesc:mission.desc}));
      if(sectionKey && sectionKey !== "__all" && section){
        items = items.filter(item => itemMatchesSection(item, section));
      }
      currentItems = items.map(item => prepareItem(item));
      index = 0;
      score = 0;
      menuView.classList.add("hidden");
      resultView.classList.add("hidden");
      gameView.classList.remove("hidden");
      document.querySelector(".progress-wrap").classList.remove("hidden");
      $("topMenuBtn").classList.remove("hidden");
      $("pageTitle").textContent = mission.title;
      $("pageSubtitle").textContent = section && section.key !== "__all" ? section.title : mission.desc;
      if(currentItems.length === 0){
        showMissionSections(id);
        return;
      }
      renderItem();
    }

    function startAllPractice(){
      window.scrollTo(0,0);
      currentMission = {id:"all", title:"Full practice", desc:"Practice grammar, vocabulary, -AR verbs, gustar, and communication across Teddy."};
      lastMissionId = "all";
      currentItems = shuffle(allPracticeItems()).map(item => prepareItem(item));
      index = 0;
      score = 0;
      menuView.classList.add("hidden");
      resultView.classList.add("hidden");
      gameView.classList.remove("hidden");
      document.querySelector(".progress-wrap").classList.remove("hidden");
      $("topMenuBtn").classList.remove("hidden");
      $("pageTitle").textContent = "Full practice";
      $("pageSubtitle").textContent = "Practice grammar, vocabulary, -AR verbs, gustar, and communication across Teddy.";
      renderItem();
    }

    function prepareItem(item){
      const copy = JSON.parse(JSON.stringify(item));
      if(copy.type === "choice") copy.shuffledOptions = shuffle(copy.options);
      if(copy.type === "dialogue") copy.tileObjects = shuffle(copy.tiles.map((t,i)=>({id:`tile_${i}_${Math.random().toString(36).slice(2)}`, text:t})));
      if(copy.type === "matching"){
        copy.leftShuffled = shuffle(copy.left);
        copy.rightShuffled = shuffle([...new Set(copy.right)]);
      }
      if(copy.type === "sorting") copy.cardsShuffled = shuffle(copy.cards);
      if(copy.type === "frame") copy.parts = copy.parts.map(p => ({...p, options:shuffle(p.options)}));
      return copy;
    }

    function scoredTotal(){
      return currentItems.filter(item => !item.noScore).length;
    }

    function updateProgress(){
      const total = currentItems.length;
      const possible = scoredTotal();
      $("progressText").textContent = `Question ${Math.min(index+1,total)} of ${total}`;
      $("scoreText").textContent = possible ? `Score: ${score} / ${possible}` : "Presentation mode";
      $("progressFill").style.width = `${(index / total) * 100}%`;
    }

    function renderItem(){
      answered = false;
      selectedOption = null;
      builtTiles = [];
      matchAnswers = {};
      feedbackBox.className = "feedback";
      feedbackBox.innerHTML = "";
      checkBtn.classList.remove("hidden");
      nextBtn.classList.add("hidden");
      nextBtn.textContent = "Next";
      undoBtn.classList.add("hidden");
      resetBtn.classList.add("hidden");
      checkBtn.disabled = false;
      updateProgress();

      const item = currentItems[index];
      $("missionTitle").textContent = item.missionTitle || currentMission.title;
      $("activityLabel").textContent = item.activity || currentMission.title;
      $("missionInstruction").textContent = item.instruction || "Choose the best answer.";

      if(item.type === "choice") renderChoice(item);
      if(item.type === "dialogue") renderDialogue(item);
      if(item.type === "matching") renderMatching(item);
      if(item.type === "frame") renderFrame(item);
      if(item.type === "sorting") renderSorting(item);
      if(item.type === "cards") renderCards(item);
      if(item.type === "lesson") renderLesson(item);
      if(item.type === "type") renderType(item);
    }

    function renderBlocks(item){
      let html = "";
      if(item.context) html += `<div class="context-box">${escapeHtml(item.context)}</div>`;
      if(item.prompt) html += `<div class="prompt-box"><div class="prompt">${escapeHtml(item.prompt)}</div></div>`;
      return html;
    }

    function renderChoice(item){
      questionArea.innerHTML = `
        ${renderBlocks(item)}
        <div class="options">
          ${item.shuffledOptions.map((opt,i)=>`
            <button class="option" data-value="${escapeHtml(opt)}">
              <span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>
            </button>
          `).join("")}
        </div>
      `;
      document.querySelectorAll(".option").forEach(btn => {
        btn.addEventListener("click", () => {
          if(answered) return;
          document.querySelectorAll(".option").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          selectedOption = btn.dataset.value;
        });
      });
    }

    function renderDialogue(item){
      questionArea.innerHTML = `
        <div class="dialogue-area" id="dialogueArea">
          ${item.speakers.map((speaker,i)=>`
            <div class="dialogue-line">
              <div class="speaker">Speaker ${escapeHtml(speaker)}</div>
              <div class="slot" data-slot="${i}"><span>Click a tile...</span></div>
            </div>
          `).join("")}
        </div>
        <div class="tile-bank">
          ${item.tileObjects.map(tile=>`<button class="tile" data-id="${tile.id}">${escapeHtml(tile.text)}</button>`).join("")}
        </div>
        <p class="mini-note" id="tileCounter">0/${item.speakers.length} tiles placed</p>
      `;
      undoBtn.classList.remove("hidden");
      resetBtn.classList.remove("hidden");
      undoBtn.disabled = true;
      resetBtn.disabled = false;
      document.querySelectorAll(".tile").forEach(btn => {
        btn.addEventListener("click", () => {
          if(answered || btn.disabled || builtTiles.length >= item.speakers.length) return;
          const tile = item.tileObjects.find(t => t.id === btn.dataset.id);
          builtTiles.push(tile);
          btn.disabled = true;
          btn.classList.add("disabled");
          updateDialogueSlots(item);
        });
      });
    }

    function updateDialogueSlots(item){
      document.querySelectorAll(".slot").forEach((slot,i)=>{
        const tile = builtTiles[i];
        slot.className = tile ? "slot filled" : "slot";
        slot.querySelector("span").textContent = tile ? tile.text : "Click a tile...";
      });
      $("tileCounter").textContent = `${builtTiles.length}/${item.speakers.length} tiles placed`;
      undoBtn.disabled = builtTiles.length === 0 || answered;
    }

    function renderMatching(item){
      questionArea.innerHTML = `
        <div class="match-grid">
          ${item.leftShuffled.map(left=>`
            <div class="match-card">
              <div class="match-left">${escapeHtml(left)}</div>
              <select data-left="${escapeHtml(left)}">
                <option value="">Choose...</option>
                ${item.rightShuffled.map(right=>`<option value="${escapeHtml(right)}">${escapeHtml(right)}</option>`).join("")}
              </select>
            </div>
          `).join("")}
        </div>
      `;
      document.querySelectorAll("select[data-left]").forEach(sel => {
        sel.addEventListener("change", () => { matchAnswers[sel.dataset.left] = sel.value; });
      });
    }

    function renderFrame(item){
      questionArea.innerHTML = `
        ${renderBlocks(item)}
        <div class="frame-grid">
          ${item.parts.map((part,i)=>`
            <div class="frame-card">
              <div class="frame-label">${escapeHtml(part.label)}</div>
              <div class="frame-line">
                ${escapeHtml(part.before)}
                <select data-frame-index="${i}">
                  <option value="">Choose...</option>
                  ${part.options.map(opt=>`<option value="${escapeHtml(opt)}">${escapeHtml(opt)}</option>`).join("")}
                </select>
                ${escapeHtml(part.after)}
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderSorting(item){
      questionArea.innerHTML = `
        <div class="sort-grid">
          ${item.cardsShuffled.map((card,i)=>`
            <div class="sort-row">
              <div class="sort-text">${escapeHtml(card.text)}</div>
              <select data-sort-index="${i}">
                <option value="">Choose...</option>
                ${item.groups.map(g=>`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join("")}
              </select>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderLesson(item){
      checkBtn.classList.add("hidden");
      nextBtn.classList.remove("hidden");
      nextBtn.textContent = "Next";
      const slides = item.slides || [];
      questionArea.innerHTML = `
        <div class="lesson-wrap">
          ${slides.map((slide, i)=>`
            <section class="lesson-slide ${slide.hero ? "hero-slide" : ""}">
              <div class="lesson-kicker">${escapeHtml(slide.kicker || `Slide ${i+1}`)}</div>
              <h3 class="lesson-title">${escapeHtml(slide.title || "")}</h3>

    function renderCards(item){
      checkBtn.classList.add("hidden");
      nextBtn.classList.remove("hidden");
      nextBtn.textContent = "Next";
      questionArea.innerHTML = `
        <div class="flash-grid">
          ${item.cards.map((card,i)=>`
            <button class="flash-card" type="button" data-card-index="${i}" aria-label="Flip card: ${escapeHtml(card.front)}">
              <span class="flash-inner">

                  ${card.emoji ? `<span class="flash-emoji">${escapeHtml(card.emoji)}</span>` : ""}

                </span>
                <span class="flash-face flash-back">
                  <span class="flash-meaning">${escapeHtml(card.back)}</span>
                  <span class="mini-note">Click again to flip back.</span>
                </span>
              </span>
            </button>
          `).join("")}
        </div>

      document.querySelectorAll(".flash-card").forEach(card => {

    function renderType(item){
      questionArea.innerHTML = `
        ${renderBlocks(item)}
        <div class="target-box">
          ${item.prompt ? `<div class="prompt">${escapeHtml(item.prompt)}</div>` : ""}

      `;

    function checkAnswer(){
      if(answered) return;
      const item = currentItems[index];
      let correct = false;
      let answerText = "";
      let feedback = item.feedback || "";

      if(item.type === "choice"){
        if(!selectedOption){ showFeedback(false,"Choose an answer first."); return; }
        correct = selectedOption === item.answer;
        answerText = item.answer;
        markChoice(item);
      }

      if(item.type === "dialogue"){
        if(builtTiles.length !== item.speakers.length){ showFeedback(false,"Use all the tiles first."); return; }
        const sequence = builtTiles.map(t => t.text);
        correct = item.accepted.some(pattern => arraysEqual(pattern, sequence));
        answerText = item.accepted[0].join(" / ");
        markDialogue(item, sequence);
      }

      if(item.type === "matching"){
        if(item.left.some(left => !matchAnswers[left])){ showFeedback(false,"Match every card first."); return; }
        correct = item.left.every(left => matchAnswers[left] === item.pairs[left]);
        answerText = item.left.map(left => `${escapeHtml(left)} → ${escapeHtml(item.pairs[left])}`).join("<br>");
        markMatching(item);
      }

      if(item.type === "frame"){
        const selects = [...document.querySelectorAll("select[data-frame-index]")];
        if(selects.some(sel => !sel.value)){ showFeedback(false,"Complete every blank first."); return; }
        correct = selects.every(sel => sel.value === item.parts[Number(sel.dataset.frameIndex)].correct);
        answerText = escapeHtml(item.displayAnswer);
        selects.forEach(sel => {
          const expected = item.parts[Number(sel.dataset.frameIndex)].correct;
          sel.classList.add(sel.value === expected ? "correct-select" : "incorrect-select");
          sel.disabled = true;
        });
      }

      if(item.type === "sorting"){
        const selects = [...document.querySelectorAll("select[data-sort-index]")];
        if(selects.some(sel => !sel.value)){ showFeedback(false,"Choose a group for every expression first."); return; }
        correct = selects.every(sel => sel.value === item.cardsShuffled[Number(sel.dataset.sortIndex)].group);
        answerText = item.cardsShuffled.map(card => `${escapeHtml(card.text)} → ${escapeHtml(card.group)}`).join("<br>");
        selects.forEach(sel => {
          const expected = item.cardsShuffled[Number(sel.dataset.sortIndex)].group;
          sel.classList.add(sel.value === expected ? "correct-select" : "incorrect-select");
          sel.disabled = true;
        });
      }

      if(item.type === "type"){
        const input = $("typeInput");
        if(!input.value.trim()){ showFeedback(false,"Type your answer first."); return; }
        correct = item.answers.map(normalizeText).includes(normalizeText(input.value));
        answerText = escapeHtml(item.displayAnswer);
        input.classList.add(correct ? "correct-input" : "incorrect-input");
        input.disabled = true;
      }

      answered = true;
      if(correct && !item.noScore) score += 1;
      updateProgress();
      $("progressFill").style.width = `${((index + 1) / currentItems.length) * 100}%`;
      showFeedback(correct, correct ? (feedback || "Correct.") : (feedback || "Try again."), answerText);
      checkBtn.classList.add("hidden");
      nextBtn.classList.remove("hidden");
      undoBtn.disabled = true;
      resetBtn.disabled = true;
    }

    function arraysEqual(a,b){ return a.length === b.length && a.every((x,i)=>x === b[i]); }

    function markChoice(item){
      document.querySelectorAll(".option").forEach(btn => {
        btn.disabled = true;
        if(btn.dataset.value === item.answer) btn.classList.add("correct");
        if(btn.dataset.value === selectedOption && selectedOption !== item.answer) btn.classList.add("incorrect");
      });
    }

    function markDialogue(item, sequence){
      const firstAccepted = item.accepted[0];
      document.querySelectorAll(".slot").forEach((slot,i)=>{
        slot.classList.add(sequence[i] === firstAccepted[i] ? "correct-slot" : "incorrect-slot");
      });
      document.querySelectorAll(".tile").forEach(btn => btn.disabled = true);
    }

    function markMatching(item){
      document.querySelectorAll("select[data-left]").forEach(sel => {
        const expected = item.pairs[sel.dataset.left];
        sel.classList.add(sel.value === expected ? "correct-select" : "incorrect-select");
        sel.disabled = true;
      });
    }

    function showFeedback(correct, message, answerText=""){
      feedbackBox.className = `feedback show ${correct ? "ok" : "bad"}`;
      if(answered){
        feedbackBox.innerHTML = `
          <div>${correct ? "✅ Correct!" : "💡 Not quite."} ${escapeHtml(message)}</div>
          ${answerText ? `<div class="answer-line">Correct answer:<br>${answerText}</div>` : ""}
        `;
      }else{
        feedbackBox.innerHTML = `<div>${escapeHtml(message)}</div>`;
      }
    }

    function nextItem(){
      index += 1;
      if(index >= currentItems.length){
        showResults();
      }else{
        renderItem();
      }
    }

    function showResults(){
      menuView.classList.add("hidden");
      gameView.classList.add("hidden");
      resultView.classList.remove("hidden");
      $("topMenuBtn").classList.remove("hidden");
      const possible = scoredTotal();
      if(possible === 0){
        $("finalScore").textContent = "Practice complete";
        $("finalMessage").textContent = "Review the cards again whenever you want.";
        return;
      }
      $("finalScore").textContent = `${score} / ${possible}`;
      const pct = Math.round((score / possible) * 100);
      $("finalMessage").textContent = pct >= 85 ? "Excellent work!" : pct >= 65 ? "Good work. Try again to improve!" : "Keep practicing. You can try again!";
    }

    function resetCurrentItem(){ renderItem(); }

    function undoDialogue(){
      const removed = builtTiles.pop();
      if(!removed) return;
      const btn = document.querySelector(`.tile[data-id="${removed.id}"]`);
      if(btn){ btn.disabled = false; btn.classList.remove("disabled"); }
      const item = currentItems[index];
      updateDialogueSlots(item);
    }

        }else{
          const row=state.deck[state.idx],current=state.current,attempts=current.attempts.map((attempt,i)=>`<div class="twrite-attempt">Attempt ${i+1}: ${escapeHtml(attempt)}</div>`).join(""),pattern=teddyHintPattern(row.spanish,current.revealed),marked=teddyIsMarked(row);
          questionArea.innerHTML=`<div class="twrite-shell"><div class="tlex-toolbar">${topicControl}<div class="tlex-stats"><span class="tlex-stat">${state.idx+1} / ${total}</span><span class="tlex-stat">Score ${state.score}</span></div></div><div class="twrite-grid"><article class="twrite-card"><div class="tlex-emoji" aria-hidden="true">${escapeHtml(row.emoji)}</div><div class="tlex-term">${escapeHtml(row.english)}</div><div class="tlex-category">${escapeHtml(row.category)}</div><button type="button" class="teddy-flag-btn ${marked?"marked":""}" id="teddyWriteFlag">${marked?"★ Marked for review":"☆ Mark for review"}</button></article><section class="twrite-panel"><h3>Write the answer in Spanish</h3><p>Capitalization, accents, spaces, and punctuation do not affect correctness. The letters themselves must be correct.</p><input id="teddyWriteInput" class="twrite-input ${current.solved?(current.revealedAnswer?"incorrect":"correct"):""}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Write the Spanish word or expression..." value="${escapeHtml(current.inputValue)}" ${current.solved?"disabled":""}/><div class="twrite-hint-box"><span class="twrite-hint-label">Revealed letters</span><div class="twrite-pattern">${escapeHtml(pattern)}</div></div>${current.feedback?`<div class="${current.solved&&!current.revealedAnswer?"twrite-answer":"twrite-attempt"}">${escapeHtml(current.feedback)}</div>`:""}${current.solved?`<div class="twrite-answer">Answer: ${escapeHtml(row.spanish)}${row.note?`<br><span style="font-weight:750">${escapeHtml(row.note)}</span>`:""}</div>`:""}${attempts?`<div class="twrite-attempts">${attempts}</div>`:""}<div class="twrite-controls">${current.solved?`${current.revealedAnswer?`<button class="btn secondary" id="teddyWriteRetryCompleted">Try this item again</button>`:""}<button class="btn" id="teddyWriteNext">Next item</button>`:`<button class="btn" id="teddyWriteSubmit">Submit answer</button><button class="btn secondary" id="teddyWriteTryAgain">Try again</button><button class="btn secondary" id="teddyWriteHint">Show more hints</button><button class="btn ghost" id="teddyWriteReveal">Reveal answer</button>`}</div><p class="twrite-help">You can also press Enter to submit.</p></section></div><div class="tlex-actions"><button class="btn secondary" id="teddyWritePrevious" ${state.history.length||current.solved?"":"disabled"}>Previous step</button><button class="btn" id="teddyWriteRestart">Restart game</button></div><div id="teddyWriteHistory"></div>${teddyReviewPanelHtml()}</div>`;
        }
        const select=document.getElementById("teddyWriteCategory");if(select)select.addEventListener("change",()=>{resetTeddyWritingGame(select.value,false);renderTeddyWritingGame();});
        const restart=document.getElementById("teddyWriteRestart");if(restart)restart.addEventListener("click",()=>{resetTeddyWritingGame(state.category,state.reviewOnly);renderTeddyWritingGame();});
        const previous=document.getElementById("teddyWritePrevious");if(previous)previous.addEventListener("click",previousTeddyWriteStep);
        const flag=document.getElementById("teddyWriteFlag");if(flag&&state.idx<total)flag.addEventListener("click",()=>{teddyToggleMarked(state.deck[state.idx]);renderTeddyWritingGame();});
        const input=document.getElementById("teddyWriteInput");if(input){input.addEventListener("input",()=>{state.current.inputValue=input.value;});input.addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();submitTeddyWriteAnswer();}});if(!state.current.solved)setTimeout(()=>input.focus(),0);}
        const submit=document.getElementById("teddyWriteSubmit");if(submit)submit.addEventListener("click",submitTeddyWriteAnswer);
        const retry=document.getElementById("teddyWriteTryAgain");if(retry)retry.addEventListener("click",tryTeddyWriteAgain);
        const hint=document.getElementById("teddyWriteHint");if(hint)hint.addEventListener("click",moreTeddyWriteHints);
        const reveal=document.getElementById("teddyWriteReveal");if(reveal)reveal.addEventListener("click",revealTeddyWriteAnswer);
        const retryCompleted=document.getElementById("teddyWriteRetryCompleted");if(retryCompleted)retryCompleted.addEventListener("click",retryCompletedTeddyWriteItem);
        const next=document.getElementById("teddyWriteNext");if(next)next.addEventListener("click",nextTeddyWriteItem);
        renderTeddyWriteHistory();
        bindTeddyReviewPanel(renderTeddyWritingGame);
      };

      translationMission.desc="Choose English meanings for Spanish words and expressions. Mark unfamiliar items and practice them later.";
      writingMission.desc="Write Spanish from English clues with progressive hints. Mark unfamiliar items and practice them later.";
      if(!missions.some(m=>m.id==="teddyReviewVocabulary")){
        const writingIndex=missions.findIndex(m=>m.id==="teddyWritingGame");
        missions.splice(writingIndex>=0?writingIndex+1:missions.length,0,{id:"teddyReviewVocabulary",title:"Vocabulary to review",desc:"See the vocabulary you marked as unfamiliar, unmark items, or practice only that set.",icon:"⭐",items:()=>[]});
      }
      const previousStartMissionReview=startMission;
      startMission=function(id,sectionKey="__all"){
        if(id==="teddyReviewVocabulary")return openTeddyReviewVocabulary();
        return previousStartMissionReview(id,sectionKey);
      };

      const mixedForEstar=missions.find(m=>m.id==="mixedNewReview");
      if(mixedForEstar&&!mixedForEstar.__estarExpanded){
        mixedForEstar.__estarExpanded=true;
        mixedForEstar.title="Mixed review: questions, -AR, ser, estar, and gustar";
        mixedForEstar.desc="Review question words, classroom language, -AR verbs, ser, estar, adjectives, and gustar.";
        const previousMixedItemsForEstar=mixedForEstar.items;
        mixedForEstar.items=()=>[...previousMixedItemsForEstar(),
          choice("Mixed review: ser vs. estar","Choose the sentence that says where Ana is.",null,["Ana está en la biblioteca.","Ana es estudiante.","Ana es de Colombia.","Ana está contenta."],"Ana está en la biblioteca.","Use estar for location."),
          choice("Mixed review: estar","Choose the sentence that means: They are sick.",null,["Ellos están enfermos.","Nosotros estamos enojados.","Ella está contenta.","Yo estoy cansado."],"Ellos están enfermos.","Están matches ellos."),
          choice("Mixed review: location","The books are under the table.",null,["Los libros están debajo de la mesa.","Los libros están encima de la mesa.","Los libros están al lado de la mesa.","Los libros están lejos de la mesa."],"Los libros están debajo de la mesa.","Use debajo de for under.")
        ];
      }

      const previousFinalItemsForEstar=finalItems;
      finalItems=function(){return [...previousFinalItemsForEstar(),
        choice("Final conversation","A classmate asks how you are. You feel tired.", "¿Cómo estás hoy?",["Estoy cansado/a.","Estoy feliz.","Estoy en la biblioteca.","Soy estudiante."],"Estoy cansado/a.","Use estar for how you feel now."),
        choice("Final conversation","Choose the sentence that says the computers are on top of the table.",null,["Las computadoras están encima de la mesa.","Las computadoras están debajo de la mesa.","Las computadoras están delante de la mesa.","Las computadoras están al lado de la mesa."],"Las computadoras están encima de la mesa.","Use están + encima de."),
        choice("Final conversation","Choose the sentence that gives origin.",null,["Ella es de México.","Ella está en México.","Ella está feliz.","Ella es estudiante."],"Ella es de México.","Use ser for origin."),
        choice("Final conversation","Choose the sentence that gives a current health condition.",null,["Él está enfermo hoy.","Él es estudiante.","Él es de Colombia.","Él está en la oficina."],"Él está enfermo hoy.","Use estar for current health.")
      ];};
      const finalMissionForEstar=missions.find(m=>m.id==="final");
      if(finalMissionForEstar)finalMissionForEstar.desc="Complete a full interaction using communication, -AR verbs, ser, estar, and gustar.";

      const previousStartAllPracticeForEstar=startAllPractice;
      startAllPractice=function(){
        previousStartAllPracticeForEstar();
        if(currentMission?.id==="all"){
          currentMission.desc="Practice grammar, vocabulary, -AR verbs, ser, estar, gustar, and communication across Teddy.";
          $("pageSubtitle").textContent=currentMission.desc;
        }
      };


      const heroSubtitle=document.querySelector("#menuView .hero > .subtitle");if(heroSubtitle)heroSubtitle.textContent="Choose a mission, a vocabulary game, or full practice. Correct answers appear only after you try.";
    })();
    // ===== End global Teddy vocabulary games =====

    $("allPracticeBtn").addEventListener("click", startAllPractice);
    $("menuBtn").addEventListener("click", showMenu);
    $("topMenuBtn").addEventListener("click", showMenu);
    $("resultsMenuBtn").addEventListener("click", showMenu);
    $("tryAgainBtn").addEventListener("click", () => lastMissionId === "all" ? startAllPractice() : startMission(lastMissionId || missions[0].id, lastSectionKey || "__all"));
    checkBtn.addEventListener("click", checkAnswer);
    nextBtn.addEventListener("click", nextItem);
    undoBtn.addEventListener("click", undoDialogue);
    resetBtn.addEventListener("click", resetCurrentItem);

    initMenu();
    showMenu();
  </script>
</body>
</html>
